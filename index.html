<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

        <title>WeatherNow!</title>

        <link rel="stylesheet" href="style.css">
        <script src="weatherData.js" defer></script>
    </head>

    <body>

        <select id="city1" onchange="getWeather()">

        <textarea id="weather" rows="7" cols="60" readonly></textarea>
